services:
  onedrive-chatgpt:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # OAuth discovery uses tunnel-client's constrained Harpoon channel to
      # fetch PRMD from the same-container MCP loopback listener. Allow HTTP
      # only for that private hop; the issuer and every public URL stay HTTPS.
      HARPOON_ALLOW_PLAINTEXT_HTTP: "true"

      # Entra API registration and token validation. The api:// identifier is
      # not the public MCP URL.
      ONEDRIVE_MCP_AUTH_MODE: "oauth"
      ONEDRIVE_MCP_OAUTH_TENANT: "consumers"
      ONEDRIVE_MCP_OAUTH_API_CLIENT_ID: "REPLACE_WITH_MCP_API_CLIENT_ID"
      ONEDRIVE_MCP_OAUTH_API_RESOURCE: "api://REPLACE_WITH_MCP_API_CLIENT_ID"
      ONEDRIVE_MCP_OAUTH_API_SCOPE: "api://REPLACE_WITH_MCP_API_CLIENT_ID/access_as_user"
      ONEDRIVE_MCP_OAUTH_SCOPE_CLAIM: "access_as_user"
      ONEDRIVE_MCP_OAUTH_AUDIENCE: "REPLACE_WITH_MCP_API_CLIENT_ID"
      ONEDRIVE_MCP_OAUTH_ALLOWED_CLIENT_IDS: "REPLACE_WITH_CHATGPT_ENTRA_CLIENT_ID"
      ONEDRIVE_MCP_OAUTH_AUTHORITY: "https://login.microsoftonline.com/consumers/v2.0"
      # This is the public compatibility service advertised to ChatGPT. Keep
      # ONEDRIVE_MCP_OAUTH_AUTHORITY above pointed at Microsoft for inbound
      # token signature/issuer validation.
      ONEDRIVE_MCP_OAUTH_AUTHORIZATION_SERVER: "https://REPLACE_WITH_PUBLIC_OAUTH_COMPAT_HOST"
      ONEDRIVE_MCP_OAUTH_GRAPH_SCOPES: "https://graph.microsoft.com/.default"

      # Public MCP identity. Copy the exact externally visible HTTPS values
      # advertised for this tunnel; never use api:// identifiers or loopback.
      # Secure MCP Tunnel rewrites same-tunnel discovery/challenge URLs to its
      # public service URLs. Verify the final values with tunnel doctor.
      ONEDRIVE_MCP_PROTECTED_RESOURCE: "https://REPLACE_WITH_EXACT_PUBLIC_TUNNEL_MCP_ENDPOINT"
      ONEDRIVE_MCP_PROTECTED_RESOURCE_ALIASES: "https://tunnel-service.gateway.unified-0.internal.api.openai.org/v1/mcp/tunnel_REPLACE_WITH_OAUTH_TUNNEL_ID"
      ONEDRIVE_MCP_RESOURCE_METADATA_URL: "https://REPLACE_WITH_EXACT_PUBLIC_TUNNEL_PROTECTED_RESOURCE_METADATA_URL"

      # ChatGPT sends the RFC 8707 resource parameter, which Entra v2 does not
      # accept directly. The adapter validates the exact request, removes only
      # that parameter, and forwards the remaining OAuth request to Entra.
      ONEDRIVE_OAUTH_COMPAT_ENABLED: "true"
      ONEDRIVE_OAUTH_COMPAT_HOST: "0.0.0.0"
      ONEDRIVE_OAUTH_COMPAT_PORT: "3010"
      ONEDRIVE_OAUTH_COMPAT_PUBLIC_ISSUER: "https://REPLACE_WITH_PUBLIC_OAUTH_COMPAT_HOST"
      ONEDRIVE_OAUTH_COMPAT_PROTECTED_RESOURCE: "https://REPLACE_WITH_EXACT_PUBLIC_TUNNEL_MCP_ENDPOINT"
      # ChatGPT Work rewrites a tunnel resource to this product-internal
      # identifier. The facade accepts only an exact same-tunnel gateway alias
      # and continues to issue the canonical public resource as `aud`.
      ONEDRIVE_OAUTH_COMPAT_PROTECTED_RESOURCE_ALIASES: "https://tunnel-service.gateway.unified-0.internal.api.openai.org/v1/mcp/tunnel_REPLACE_WITH_OAUTH_TUNNEL_ID"
      ONEDRIVE_OAUTH_COMPAT_CLIENT_ID: "REPLACE_WITH_CHATGPT_ENTRA_CLIENT_ID"
      ONEDRIVE_OAUTH_COMPAT_REDIRECT_URI: "https://chatgpt.com/connector/oauth/REPLACE_WITH_CALLBACK_ID"
      ONEDRIVE_OAUTH_COMPAT_SCOPES: "api://REPLACE_WITH_MCP_API_CLIENT_ID/access_as_user offline_access"
      # Keep ChatGPT's outer scope narrow while using Entra's documented
      # /.default combined-consent flow for the known client + middle-tier API.
      ONEDRIVE_OAUTH_COMPAT_UPSTREAM_SCOPES: "api://REPLACE_WITH_MCP_API_CLIENT_ID/.default offline_access"
      # ChatGPT is an outer public client with mandatory S256 PKCE. The Entra
      # client secret remains private and is injected only upstream.
      ONEDRIVE_OAUTH_COMPAT_OUTER_TOKEN_AUTH_METHOD: "none"
      # Prefer ChatGPT's stable Client ID Metadata Document. DCR remains
      # implemented and tested as a controlled fallback, but is not exposed by
      # the production canary.
      ONEDRIVE_OAUTH_COMPAT_ENABLE_CIMD: "true"
      ONEDRIVE_OAUTH_COMPAT_ENABLE_DCR: "false"
      # Persist the encrypted one-time facade state under entrypoint-created,
      # node-owned /data/auth. Reuse the stable owner-only auth-vault key with
      # domain separation so rotating the OAuth client secret preserves sessions.
      ONEDRIVE_OAUTH_COMPAT_REFRESH_STORE_FILE: "/data/auth/oauth-compat-refresh-handles.json"
      ONEDRIVE_OAUTH_COMPAT_REFRESH_STORE_KEY_FILE: "/run/onedrive-runtime/auth-vault.key"
      # Register this exact URI on the Entra client.
      ONEDRIVE_OAUTH_COMPAT_PROVIDER_CALLBACK_URI: "https://REPLACE_WITH_PUBLIC_OAUTH_COMPAT_HOST/callback"
      # Keep false unless the registered confidential client is known to omit
      # PKCE entirely. In that case select client_secret_post above, configure
      # the same secret in ChatGPT, and register the exact ChatGPT callback in
      # Entra. Partial or non-S256 PKCE is always rejected.
      ONEDRIVE_OAUTH_COMPAT_ALLOW_CONFIDENTIAL_NO_PKCE: "false"
      # Missing, partial, plain, or otherwise invalid outer PKCE is rejected.
      ONEDRIVE_OAUTH_COMPAT_ALLOW_PUBLIC_NO_PKCE: "false"

    # Put the API registration's secret in runtime/oauth-api-client.secret and
    # the facade's separate private upstream Entra client secret in
    # runtime/oauth-chatgpt-client.secret. entrypoint.sh copies both into the
    # private in-memory runtime mount at 0600; never reuse one app's secret for
    # the other app ID.
    ports:
      # Bind only to NAS loopback; expose it through a narrowly scoped trusted
      # HTTPS reverse proxy such as Tailscale Funnel.
      - "127.0.0.1:3010:3010"
