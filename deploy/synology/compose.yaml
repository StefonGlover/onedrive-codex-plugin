services:
  onedrive-chatgpt:
    build:
      context: ${ONEDRIVE_APP_CONTEXT:-./app}
      dockerfile: deploy/synology/Dockerfile
      args:
        TUNNEL_CLIENT_VERSION: "0.0.12"
        TUNNEL_CLIENT_SOURCE_SHA256: "813b300d24fd7bd0115ad4b171972c59399c40593b0fa604e9cf1fc3c795587e"
        TUNNEL_CLIENT_SOURCE_COMMIT: "881c9a8fed7cccbe6607cd419863bbca506b8215"
        TUNNEL_CLIENT_X_NET_VERSION: "v0.56.0"
        TUNNEL_CLIENT_OTEL_VERSION: "v1.43.0"
        TUNNEL_CLIENT_OTEL_CONTRIB_VERSION: "v0.65.0"
        TARGETARCH: "amd64"
    image: ${ONEDRIVE_IMAGE:-onedrive-chatgpt-nas:0.6.5}
    container_name: onedrive-chatgpt
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ONEDRIVE_CLIENT_ID: "6e97d01c-edf8-43fe-bf69-bb494ae22513"
      ONEDRIVE_TENANT: "consumers"
      ONEDRIVE_SCOPES: "offline_access User.Read Files.ReadWrite"
      ONEDRIVE_TUNNEL_ID: "tunnel_6a5cf76803d881918237de43c2db9888"
      ONEDRIVE_TOOL_PROFILE: "chatgpt"
      ONEDRIVE_TOKEN_STORE: "encrypted-file"
      ONEDRIVE_TOKEN_FILE: "/data/auth/tokens.enc"
      ONEDRIVE_TOKEN_ENCRYPTION_KEY_FILE: "/run/onedrive-runtime/auth-vault.key"
      ONEDRIVE_CONCURRENCY_LIMIT: "3"
      ONEDRIVE_MCP_AUTH_MODE: "noauth"
    volumes:
      - ./data:/data
      - ./runtime:/run/onedrive-source
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run/onedrive-runtime:size=1m,mode=0700
    pids_limit: 256
    mem_limit: 2g
