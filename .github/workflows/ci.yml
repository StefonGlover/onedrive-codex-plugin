name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Plugin regression checks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep Python bytecode from every test step out of the source tree so
      # the packaging-residue guard sees only repository content.
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/onedrive-pycache
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install shell dependencies
        timeout-minutes: 12
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            zsh libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils
          python3 -m pip install -r scripts/requirements-office-test.txt

      - name: Validate manifests and whitespace
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('.codex-plugin/plugin.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('.app.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('.mcp.json', 'utf8'))"
          git diff-tree --check --root -r HEAD
          git diff --check

      - name: Syntax check scripts
        run: |
          node --check mcp/server.mjs
          node --check mcp/http-server.mjs
          node --check mcp/oauth.mjs
          node --check mcp/oauth-compat-server.mjs
          node --check mcp/oauth-facade-token.mjs
          node --check mcp/auth-vault.mjs
          node --check mcp/bounded-local-state.mjs
          node --check mcp/heavyweight-subprocess-admission.mjs
          node --check mcp/managed-artifact-quota.mjs
          node --check mcp/materialized-resources.mjs
          node --check mcp/resource-read-admission.mjs
          node --check scripts/mock-graph-test.mjs
          node --check scripts/auth-vault-test.mjs
          node --check scripts/bounded-local-state-test.mjs
          node --check scripts/heavyweight-subprocess-admission-test.mjs
          node --check scripts/hosted-profile-boundary-test.mjs
          node --check scripts/managed-artifact-quota-test.mjs
          node --check scripts/materialized-resources-test.mjs
          node --check scripts/resource-read-admission-test.mjs
          node --check scripts/oauth-http-test.mjs
          node --check scripts/oauth-compat-test.mjs
          node --check scripts/storage-root-permissions-test.mjs
          node --check scripts/run-chatgpt-oauth-tunnel.mjs
          node --check scripts/run-chatgpt-tunnel.mjs
          node --check scripts/semantic-anchors-test.mjs
          node --check scripts/text-patch-test.mjs
          node --check scripts/prepackage-check.mjs
          node --check scripts/beta-test.mjs
          node --check scripts/benchmark.mjs
          node --check scripts/tool-contract.mjs
          node --check scripts/tool-profile-test.mjs
          node --check scripts/skill-profile-test.mjs
          node --check scripts/chatgpt-golden-test.mjs
          node --check scripts/chatgpt-work-beta-test.mjs
          node --check scripts/install-versioned-cache.mjs
          python3 -m py_compile scripts/common-text.py
          python3 -m py_compile scripts/common-text-limits-test.py
          python3 -m py_compile scripts/common-text-test.py
          python3 -m py_compile scripts/pdftoppm-limited.py
          python3 -m py_compile scripts/pdftoppm-limits-test.py
          python3 -m py_compile scripts/office-fixture-factory.py
          zsh -n scripts/configure.zsh

      - name: Run utility self-checks
        run: |
          node scripts/auth-vault-test.mjs
          node scripts/beta-test.mjs --self-check
          node scripts/benchmark.mjs --self-check
          node scripts/hosted-profile-boundary-test.mjs
          node scripts/tool-profile-test.mjs
          node scripts/skill-profile-test.mjs
          node scripts/chatgpt-golden-test.mjs
          node scripts/chatgpt-work-beta-test.mjs --self-check
          node scripts/install-versioned-cache.mjs --self-check
          if node scripts/beta-test.mjs --self-check --stale-days=-1; then
            echo "beta-test should reject negative --stale-days" >&2
            exit 1
          fi
          if node scripts/beta-test.mjs --self-check --cleanup-page-size=invalid; then
            echo "beta-test should reject invalid numeric cleanup controls" >&2
            exit 1
          fi
          if node scripts/beta-test.mjs --live --run-id=codex-beta-ci --invite-recipient=beta@example.test; then
            echo "beta-test should reject --live without --confirmed" >&2
            exit 1
          fi
          if node scripts/beta-test.mjs --live --confirmed --invite-recipient=beta@example.test; then
            echo "beta-test should reject --live without an exact --run-id" >&2
            exit 1
          fi

      - name: Run mocked Microsoft Graph tests
        run: |
          python3 scripts/common-text-test.py
          python3 scripts/common-text-limits-test.py
          python3 scripts/office-openxml-test.py
          python3 scripts/office-security-test.py
          SOFFICE="$(command -v soffice)" python3 scripts/office-real-fixture-test.py
          node scripts/semantic-anchors-test.mjs
          node scripts/text-patch-test.mjs
          ONEDRIVE_TOOL_PROFILE=chatgpt node scripts/oauth-http-test.mjs
          node scripts/oauth-compat-test.mjs
          node scripts/storage-root-permissions-test.mjs
          node scripts/bounded-local-state-test.mjs
          node scripts/heavyweight-subprocess-admission-test.mjs
          node scripts/managed-artifact-quota-test.mjs
          node scripts/materialized-resources-test.mjs
          node scripts/resource-read-admission-test.mjs
          python3 scripts/pdftoppm-limits-test.py
          node scripts/mock-graph-test.mjs

      - name: Run prepackage guard
        run: |
          node scripts/prepackage-check.mjs --self-check
          node scripts/prepackage-check.mjs
          if node scripts/prepackage-check.mjs --installed; then
            echo "prepackage-check --installed without a path should fail" >&2
            exit 1
          fi
          if node scripts/prepackage-check.mjs --installed=/definitely/missing/onedrive-cache; then
            echo "prepackage-check should parse and reject a missing --installed=/path" >&2
            exit 1
          fi
